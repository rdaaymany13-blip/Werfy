name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SHEYVAR'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "ir.sheyvarnews.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "ir.sheyvarnews.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  resourceConfigurations += listOf("fa", "en")
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("org.jsoup:jsoup:1.17.2")
          }
          EOF_SHEYVAR
          mkdir -p app
          cat > app/proguard-rules.pro <<'EOF_SHEYVAR'
          -dontwarn com.google.re2j.**
          -dontwarn org.jspecify.annotations.**
          EOF_SHEYVAR
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_SHEYVAR'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SHEYVAR
          mkdir -p app/src/main/java/ir/sheyvarnews/app
          cat > app/src/main/java/ir/sheyvarnews/app/MainActivity.kt <<'EOF_SHEYVAR'
          package ir.sheyvarnews.app

          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImage
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = if (isSystemInDarkTheme()) darkColorScheme() else lightColorScheme()) {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                              Surface(Modifier.fillMaxSize()) { App() }
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun App() {
              var cats by remember { mutableStateOf<List<Cat>>(emptyList()) }
              var cat by remember { mutableStateOf<Cat?>(null) }
              var list by remember { mutableStateOf<List<Item>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }
              var err by remember { mutableStateOf(false) }
              var tick by remember { mutableIntStateOf(0) }
              var open by remember { mutableStateOf<Item?>(null) }

              LaunchedEffect(cat, tick) {
                  loading = true; err = false
                  val need = cats.isEmpty()
                  val path = cat?.let { "/category/${it.id}" } ?: "/"
                  try {
                      val r = withContext(Dispatchers.IO) {
                          val d = Repo.get(path)
                          Pair(Repo.items(d), if (need) Repo.cats(d) else null)
                      }
                      list = r.first
                      r.second?.let { cats = it }
                  } catch (e: Exception) { err = true }
                  loading = false
              }

              BackHandler(open != null) { open = null }
              BackHandler(open == null && cat != null) { cat = null }

              open?.let { Detail(it) { open = null }; return }

              Scaffold(topBar = { TopAppBar(title = { Text(cat?.name ?: "شیورنیوز", fontWeight = FontWeight.Bold) }) }) { pad ->
                  Column(Modifier.padding(pad)) {
                      LazyRow(contentPadding = PaddingValues(horizontal = 12.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          item { FilterChip(cat == null, { cat = null }, { Text("همه") }) }
                          items(cats) { c -> FilterChip(cat?.id == c.id, { cat = c }, { Text(c.name) }) }
                      }
                      when {
                          loading -> Box(Modifier.fillMaxSize(), Alignment.Center) { CircularProgressIndicator() }
                          err -> Column(Modifier.fillMaxSize(), Arrangement.Center, Alignment.CenterHorizontally) {
                              Text("خطا در دریافت اخبار")
                              Button({ tick++ }) { Text("تلاش مجدد") }
                          }
                          else -> LazyColumn(contentPadding = PaddingValues(12.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              items(list, key = { it.id }) { n ->
                                  Row(Modifier.fillMaxWidth().clickable { open = n }, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                      AsyncImage(
                                          n.img, null,
                                          Modifier.size(110.dp, 80.dp).clip(RoundedCornerShape(8.dp)),
                                          contentScale = ContentScale.Crop
                                      )
                                      Text(n.title, Modifier.weight(1f), maxLines = 3, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.Medium)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun Detail(item: Item, onBack: () -> Unit) {
              var a by remember { mutableStateOf<Article?>(null) }
              var err by remember { mutableStateOf(false) }
              val ctx = LocalContext.current
              LaunchedEffect(item.id) {
                  try { a = withContext(Dispatchers.IO) { Repo.article(item.id) } } catch (e: Exception) { err = true }
              }
              Scaffold(topBar = {
                  TopAppBar(
                      title = { Text("شیورنیوز") },
                      navigationIcon = { TextButton(onBack) { Text("بازگشت") } },
                      actions = {
                          TextButton({
                              val i = Intent(Intent.ACTION_SEND).apply {
                                  type = "text/plain"
                                  putExtra(Intent.EXTRA_TEXT, "${a?.title ?: item.title}\n$BASE/news/${item.id}")
                              }
                              ctx.startActivity(Intent.createChooser(i, null))
                          }) { Text("اشتراک") }
                      }
                  )
              }) { pad ->
                  Column(Modifier.padding(pad).verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      val img = a?.img ?: item.img
                      if (img != null) AsyncImage(img, null, Modifier.fillMaxWidth().clip(RoundedCornerShape(8.dp)), contentScale = ContentScale.FillWidth)
                      Text(a?.title ?: item.title, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                      when {
                          err -> Text("خطا در دریافت خبر")
                          a == null -> CircularProgressIndicator()
                          else -> a!!.paras.forEach { Text(it, fontSize = 17.sp, lineHeight = 29.sp) }
                      }
                  }
              }
          }
          EOF_SHEYVAR
          mkdir -p app/src/main/java/ir/sheyvarnews/app
          cat > app/src/main/java/ir/sheyvarnews/app/Repo.kt <<'EOF_SHEYVAR'
          package ir.sheyvarnews.app

          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document

          const val BASE = "https://sheyvarnews.ir"

          data class Item(val id: String, val title: String, val img: String?)
          data class Cat(val id: String, val name: String)
          data class Article(val title: String, val img: String?, val paras: List<String>)

          object Repo {
              fun get(path: String): Document =
                  Jsoup.connect(BASE + path).userAgent("Mozilla/5.0 (Linux; Android) SheyvarNewsApp").timeout(15000).get()

              fun cats(d: Document): List<Cat> =
                  d.select("a[href^=/category/]").mapNotNull {
                      val n = it.text().trim()
                      if (n.isEmpty()) null else Cat(it.attr("href").substringAfterLast('/'), n)
                  }.distinctBy { it.id }

              private fun imgOf(a: org.jsoup.nodes.Element): String? =
                  a.selectFirst("img")?.let { i ->
                      listOf(i.absUrl("data-src"), i.absUrl("src")).firstOrNull { it.startsWith("http") }
                  }

              fun items(d: Document): List<Item> {
                  val m = linkedMapOf<String, Pair<String, String?>>()
                  for (a in d.select("a[href*=/news/]")) {
                      val id = Regex("/news/(\\d+)").find(a.attr("href"))?.groupValues?.get(1) ?: continue
                      val h = a.selectFirst("h1,h2,h3,h4,h5")?.text()?.trim()?.takeIf { it.length > 8 }
                      val t = h ?: listOf(a.text(), a.selectFirst("img")?.attr("alt") ?: "", a.attr("title"))
                          .map { it.trim() }.maxBy { it.length }
                      val old = m[id]
                      val title = if (old != null && old.first.length >= t.length) old.first else t
                      m[id] = Pair(title, old?.second ?: imgOf(a))
                  }
                  return m.filter { it.value.first.length > 8 }.map { Item(it.key, it.value.first, it.value.second) }
              }

              fun article(id: String): Article {
                  val d = get("/news/$id")
                  val title = d.selectFirst("meta[property=og:title]")?.attr("content")?.takeIf { it.isNotBlank() }
                      ?: d.selectFirst("h1")?.text() ?: d.title()
                  val ps = d.select("p").filter { p ->
                      p.text().isNotBlank() && p.parents().none { it.tagName() in setOf("nav", "footer", "header") }
                  }
                  val best = ps.groupBy { it.parent() }.maxByOrNull { e -> e.value.sumOf { it.text().length } }?.value
                      ?: emptyList()
                  val img = d.selectFirst("meta[property=og:image]")?.attr("content")?.takeIf { it.startsWith("http") }
                      ?: d.selectFirst("article img, main img")?.let {
                          listOf(it.absUrl("data-src"), it.absUrl("src")).firstOrNull { u -> u.startsWith("http") }
                      }
                  return Article(title, img, best.map { it.text().trim() })
              }
          }
          EOF_SHEYVAR
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_SHEYVAR'
          <resources><string name="app_name">شیورنیوز</string></resources>
          EOF_SHEYVAR
          cat > build.gradle.kts <<'EOF_SHEYVAR'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_SHEYVAR
          cat > gradle.properties <<'EOF_SHEYVAR'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_SHEYVAR
          cat > settings.gradle.kts <<'EOF_SHEYVAR'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SheyvarNews"
          include(":app")
          EOF_SHEYVAR
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SheyvarNews-apk
          path: app/build/outputs/apk/release/*.apk
